name: Verify laboratory package
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  clean-build-and-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check committed follow-up provenance before regeneration
        run: python3 scripts/audit_followups.py --portable
      - name: Check that the committed summary page matches the committed reports
        run: |
          python3 docs/build_page.py
          git diff --exit-code -- docs/index.html
      - name: Check the separate Simplicity comparison evidence and page
        run: |
          python3 experiments/simplicity-version-comparison/run.py audit
          python3 experiments/simplicity-version-comparison/build_page.py
          git diff --exit-code -- docs/simplicity-version-comparison/
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake ninja-build libboost-dev pkg-config
      - name: Build the unmodified fork and profiling overlay
        run: |
          GSR_BUILD_JOBS=2 ./scripts/build.sh
          python3 scripts/profile_build.py 2
      - name: Test the separate Simplicity-construction Script port
        run: python3 experiments/simplicity-version-comparison/test_comparison.py
      - name: Regenerate public fixtures
        run: |
          python3 scripts/fixtures.py
          git diff --exit-code -- fixtures/
      - name: Run native, profiled, optimized-Python and regtest checks
        run: GSR_BUILD_JOBS=2 ./scripts/check.sh
      - name: Verify deterministic generated review artifacts
        run: git diff --exit-code -- generated/
      - name: Verify committed test coverage
        run: git diff --exit-code -- reports/tests-native-results.json reports/tests-profiled-results.json reports/tests-optimized-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-evidence
          path: reports/
