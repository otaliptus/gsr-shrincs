name: Verify laboratory package
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  clean-build-and-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake ninja-build libboost-dev pkg-config
      - name: Build the unmodified fork and profiling overlay
        run: |
          GSR_BUILD_JOBS=2 ./scripts/build.sh
          python3 scripts/profile_build.py 2
      - name: Regenerate public fixtures
        run: |
          python3 scripts/fixtures.py
          git diff --exit-code -- fixtures/
      - name: Run native, profiled, optimized-Python and regtest checks
        run: ./scripts/check.sh
      - name: Verify deterministic generated review artifacts
        run: git diff --exit-code -- generated/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-evidence
          path: reports/
